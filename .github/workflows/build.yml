name: build-images

# One matrix entry per board. Every board uses the same external-Buildroot
# flow (see build.sh): a defconfig plus a board post-image script. Adding a
# board means adding its defconfig and a matrix include, nothing else.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (blank = r<date>-<shortsha>)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'board/**'
      - 'configs/**'
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: rpi-universal
            imgdir: /mnt/rnsbox/out/rpi-universal/images
          - board: pc-x86_64
            imgdir: /mnt/rnsbox/out/pc-x86_64/images
          - board: orangepi-r1
            imgdir: /mnt/rnsbox/out/orangepi-r1/images
          - board: milkv-duo-cv1800b-rv64
            imgdir: /mnt/rnsbox/out/milkv-duo-cv1800b-rv64/images
          - board: sg2000-duomodule01-rv64
            imgdir: /mnt/rnsbox/out/sg2000-duomodule01-rv64/images
          - board: sg2002-licheerv-nano-rv64
            imgdir: /mnt/rnsbox/out/sg2002-licheerv-nano-rv64/images
          - board: sg2002-duo256m-rv64
            imgdir: /mnt/rnsbox/out/sg2002-duo256m-rv64/images
          - board: sg2000-duo-s-rv64
            imgdir: /mnt/rnsbox/out/sg2000-duo-s-rv64/images
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          docker-images: true
          large-packages: false
          haskell: false
          swap-storage: false

      - name: Disk + memory before
        run: |
          echo "## disk"; df -h / /mnt
          echo "## mem"; free -h
          echo "## cpu"; nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget curl cpio unzip rsync bc file \
            python3 python3-dev python3-setuptools \
            libssl-dev flex bison gawk texinfo help2man gettext \
            autoconf automake libtool pkg-config cmake ninja-build \
            libncurses-dev device-tree-compiler u-boot-tools \
            genext2fs dosfstools mtools parted squashfs-tools jq scons

      - name: Checkout rnsbox (the external tree)
        uses: actions/checkout@v4
        with:
          path: rnsbox

      - name: Verify generated defconfigs are current
        run: rnsbox/scripts/gen-defconfigs.sh --check

      - name: Verify overlays carry no accidental duplicates
        run: rnsbox/scripts/check-overlap.sh

      - name: Prepare scratch on /mnt
        run: |
          sudo mkdir -p /mnt/rnsbox/upstream /mnt/rnsbox/out /mnt/dl /mnt/tmp
          sudo chown -R "$USER":"$USER" /mnt/rnsbox /mnt/dl /mnt/tmp

      - name: Cache buildroot downloads
        uses: actions/cache@v4
        with:
          path: /mnt/dl
          key: br-dl-${{ matrix.board }}-${{ hashFiles('rnsbox/configs/**', 'rnsbox/package/**') }}
          restore-keys: |
            br-dl-${{ matrix.board }}-
            br-dl-

      - name: Build ${{ matrix.board }} (up to 2 attempts)
        env:
          UPSTREAM_BASE: /mnt/rnsbox/upstream
          BR2_DL_DIR: /mnt/dl
          TMPDIR: /mnt/tmp
          ODIR: /mnt/rnsbox/out/${{ matrix.board }}
        run: |
          export PATH=/usr/sbin:/sbin:$PATH
          cd rnsbox
          START=$(date +%s)
          set -o pipefail
          status=1
          for attempt in 1 2; do
            if [ "$attempt" -gt 1 ]; then
              echo "::warning::attempt 1 failed (exit $status) - retrying"
              cp /mnt/tmp/build.log /mnt/tmp/build.log.try1
            fi
            /usr/bin/time -v ./build.sh "$BOARD" 2>&1 | tee /mnt/tmp/build.log
            status=$?
            echo ">> attempt $attempt exit: $status"
            [ "$status" -eq 0 ] && break
          done
          echo "BUILD_SECONDS=$(( $(date +%s) - START ))" | tee -a "$GITHUB_ENV"
          exit $status

      - name: Build-log tail on failure
        if: failure()
        run: |
          {
            if [ -f /mnt/tmp/build.log.try1 ]; then
              echo "### build.log tail - attempt 1"
              echo '```'; tail -n 60 /mnt/tmp/build.log.try1; echo '```'
            fi
            echo "### build.log tail - last attempt"
            echo '```'; tail -n 150 /mnt/tmp/build.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk after + image + timing
        if: always()
        run: |
          echo "## disk after"; df -h / /mnt
          echo "## build minutes: $(( ${BUILD_SECONDS:-0} / 60 ))"
          echo "## images"; ls -lh "${{ matrix.imgdir }}" 2>/dev/null || echo "(no images dir)"
          echo "## last 40 build.log lines"; tail -n 40 /mnt/tmp/build.log 2>/dev/null || true

      - name: Package image
        if: success()
        run: |
          set -eux
          IMGDIR="${{ matrix.imgdir }}"
          IMG="$IMGDIR/rnsbox-$BOARD.img"
          [ -f "$IMG" ] || { echo "::error::no $IMG"; ls -lh "$IMGDIR"; exit 1; }
          STAGE="$RUNNER_TEMP/pkg"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -v "$IMG" "$STAGE/"
          cd "$STAGE"
          if ! xz -T2 -9 -k -f "$(basename "$IMG")"; then
            echo "::warning::xz -9 failed; trying -6"
            xz -T2 -6 -k -f "$(basename "$IMG")"
          fi
          sha256sum *.img.xz > SHA256SUMS
          ls -lh
          echo "IMGDIR=$STAGE" >> "$GITHUB_ENV"

      - name: Upload image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rnsbox-${{ matrix.board }}-image
          path: |
            ${{ env.IMGDIR }}/*.img.xz
            ${{ env.IMGDIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.board }}
          path: /mnt/tmp/build.log*
          if-no-files-found: warn
          retention-days: 7

  release:
    # One release per run; matrix jobs only upload artifacts. A push run is a
    # pre-release, a manual workflow_dispatch is a full release.
    name: release (all boards)
    needs: build
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - name: Collect images from all boards
        uses: actions/download-artifact@v4
        with:
          pattern: rnsbox-*-image
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          VER="${{ github.event.inputs.version }}"
          [ -z "$VER" ] && VER="r$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then IS_PRE=true; else IS_PRE=false; fi
          mkdir -p rel
          {
            echo "Automated RNSBox build from \`${GITHUB_SHA:0:7}\` (branch \`${GITHUB_REF_NAME}\`)."
            echo
            if [ "$IS_PRE" = true ]; then
              echo "> Auto-build: marked as a **pre-release**. Full releases are cut by running this workflow manually."
              echo
            fi
            echo "| Image | sha256 |"
            echo "|---|---|"
            for d in dist/*/; do
              for xz in "$d"*.img.xz; do
                [ -e "$xz" ] || { echo "::error::no image in $d"; exit 1; }
                cp "$xz" rel/
                echo "| \`$(basename "$xz")\` | \`(see SHA256SUMS below)\` |"
              done
            done
            echo
            echo "### SHA256"
            echo '```'
            cat dist/*/SHA256SUMS
            echo '```'
            echo
            echo "Flash the image for your board to a microSD:"
            echo '```'
            echo "xz -d rnsbox-<board>.img.xz"
            echo "sudo dd if=rnsbox-<board>.img of=/dev/sdX bs=4M conv=fsync status=progress"
            echo '```'
            echo
            echo "Web admin: http://10.42.0.1 (admin/admin; change it after first login)."
            echo "SSH: ssh admin@10.42.0.1 (admin/admin; change the password in Settings)."
          } > /tmp/notes.md
          cd rel
          if gh release view "$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VER" --repo "${{ github.repository }}" --clobber *.img.xz
            gh release edit "$VER" --repo "${{ github.repository }}" "--prerelease=$IS_PRE"
          else
            gh release create "$VER" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "RNSBox $VER" --notes-file /tmp/notes.md "--prerelease=$IS_PRE" *.img.xz
          fi
          cat /tmp/notes.md
