name: build-images

# Multi-board image builder. Each matrix entry is one board (see build.sh).
# External-tree boards (BUILD_STYLE=external, e.g. rpi0-2w) build straight
# from this repository used as a BR2_EXTERNAL tree: build.sh clones the
# pinned upstream once, shares the download cache and builds into a
# per-board O= directory. Adding a board = one more matrix include.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant to build"
        type: choice
        options: [lite, dvd]
        default: lite
      version:
        description: "Release tag (blank = r<date>-<shortsha>). One release per run holds every board's image; checksums are in the notes."
        type: string
        default: ""
  push:
    branches: [raspberry-pi-zero-2w]
    paths:
      - 'package/**'
      - 'board/**'
      - 'configs/**'
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/build.yml'

concurrency:
  # NB: the workflow-level context has no `matrix`, so the group is ref-only;
  # boards build as parallel matrix jobs of this one workflow.
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to publish a Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # external tree: images at $ODIR/images/rnsbox-<board>-<variant>.img
          - board: rpi0-2w
            imgdir: /mnt/rnsbox/out/rpi0-2w/images
          # patch series over the vendor BSP: build.sh clones the BSP into
          # $WORKDIR and the packer leaves <...>-<variant>.img in install/
          - board: licheerv-nano
            imgdir: /mnt/rnsbox/lichee/install/soc_sg2002_licheervnano_sd/images
    env:
      BOARD: ${{ matrix.board }}
      VARIANT: ${{ github.event.inputs.variant || 'lite' }}
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          docker-images: true
          large-packages: false   # slow apt-remove; /mnt gives us the room
          haskell: false
          swap-storage: false     # keep swap — the build wants memory

      - name: Disk + memory before
        run: |
          echo "## disk"; df -h / /mnt
          echo "## mem";  free -h
          echo "## cpu";  nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget curl cpio unzip rsync bc file \
            python3 python3-dev python3-setuptools \
            libssl-dev flex bison gawk texinfo help2man gettext \
            autoconf automake libtool pkg-config cmake ninja-build \
            libncurses5-dev device-tree-compiler u-boot-tools \
            genext2fs dosfstools mtools parted squashfs-tools jq

      - name: Checkout rnsbox (the external tree)
        uses: actions/checkout@v4
        with:
          path: rnsbox

      - name: Prepare scratch on /mnt (the roomy disk)
        run: |
          sudo mkdir -p /mnt/rnsbox/upstream /mnt/rnsbox/out /mnt/dl /mnt/tmp
          sudo chown -R "$USER":"$USER" /mnt/rnsbox /mnt/dl /mnt/tmp

      - name: Cache buildroot downloads (shared across boards)
        uses: actions/cache@v4
        with:
          path: /mnt/dl
          key: br-dl-${{ matrix.board }}-${{ hashFiles('rnsbox/configs/**', 'rnsbox/package/**') }}
          restore-keys: |
            br-dl-${{ matrix.board }}-
            br-dl-

      - name: Build ${{ matrix.board }} ${{ env.VARIANT }}
        env:
          UPSTREAM_BASE: /mnt/rnsbox/upstream
          BR2_DL_DIR: /mnt/dl
          TMPDIR: /mnt/tmp
          ODIR: /mnt/rnsbox/out/${{ matrix.board }}
          # patch-flow boards (licheerv-nano) clone the BSP here, off the
          # checkout dir; the external flow ignores it
          WORKDIR: /mnt/rnsbox/lichee
        run: |
          export PATH=/usr/sbin:/sbin:$PATH
          cd rnsbox
          START=$(date +%s)
          set -o pipefail
          # Rust's bootstrap (x.py) panics on --stage 1 when it detects CI
          # markers (GITHUB_ACTIONS / TF_BUILD) and demands a full stage-2
          # bootstrap. Scrub those markers for the build only (relevant the
          # day a board pulls host-rust).
          ( unset GITHUB_ACTIONS TF_BUILD CI
            /usr/bin/time -v ./build.sh "$BOARD" "$VARIANT" ) \
            2>&1 | tee /mnt/tmp/build.log
          echo "BUILD_SECONDS=$(( $(date +%s) - START ))" | tee -a "$GITHUB_ENV"

      - name: Disk after + image + timing
        if: always()
        run: |
          echo "## disk after"; df -h / /mnt
          echo "## build minutes: $(( ${BUILD_SECONDS:-0} / 60 ))"
          echo "## images"; ls -lh "${{ matrix.imgdir }}" 2>/dev/null || echo "(no images dir — build did not reach packaging)"
          echo "## last 40 build.log lines"; tail -n 40 /mnt/tmp/build.log 2>/dev/null || true

      - name: Package image (.img.xz, normalized name)
        if: success()
        run: |
          set -x
          IMGDIR="${{ matrix.imgdir }}"
          df -h / /mnt
          ls -la "$IMGDIR" || echo "::error::images dir missing: $IMGDIR"
          # rpi names the image deterministically; the lichee packer copies its
          # genimage output to <vendor-name>-<variant>.img — glob for it, then
          # normalize: every board ships as rnsbox-<board>-<variant>.img so the
          # single multi-board release holds consistently named assets.
          IMG="$(ls -t "$IMGDIR"/*-"$VARIANT".img 2>/dev/null | head -1)"
          [ -n "$IMG" ] || IMG="$(ls -t "$IMGDIR"/*.img 2>/dev/null | head -1)"
          if [ -z "$IMG" ]; then
            echo "::error::no .img in $IMGDIR for variant $VARIANT"
            exit 1
          fi
          IMG="$(basename "$IMG")"
          echo "Packaging $IMG"
          BASE="rnsbox-$BOARD-$VARIANT"
          STAGE="$RUNNER_TEMP/pkg"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -v "$IMGDIR/$IMG" "$STAGE/$BASE.img" || echo "::error::cp failed; df=$(df -h / /mnt | tr -s ' ' | tr '\n' ';')"
          cd "$STAGE"
          if ! xz -T2 -9 -k -f "$BASE.img"; then
            echo "::error::xz -9 failed; df=$(df -h / /mnt | tr -s ' ' | tr '\n' ';')"
            xz -T2 -6 -k -f "$BASE.img" || { echo "::error::xz -6 failed too"; ls -la; exit 1; }
          fi
          # checksums go into the release notes text; keep the file internal
          # to the artifact so the release job can quote it there
          sha256sum "$BASE.img.xz" | tee SHA256SUMS
          ls -lh
          { echo "IMG=$BASE.img"; echo "IMGDIR=$STAGE"; } >> "$GITHUB_ENV"

      - name: Upload image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rnsbox-${{ matrix.board }}-${{ env.VARIANT }}-image
          path: |
            ${{ env.IMGDIR }}/${{ env.IMG }}.xz
            ${{ env.IMGDIR }}/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.board }}
          path: /mnt/tmp/build.log
          if-no-files-found: warn
          retention-days: 7

  release:
    # ONE release per run holding every board's image. The matrix jobs only
    # upload artifacts; the tag is created exactly once, here, so parallel
    # boards can never collide on it. Checksums are quoted in the notes —
    # no SHA256SUMS asset.
    name: release (all boards)
    needs: build
    if: success()
    runs-on: ubuntu-latest
    env:
      VARIANT: ${{ github.event.inputs.variant || 'lite' }}
    steps:
      - name: Collect images from all boards
        uses: actions/download-artifact@v4
        with:
          pattern: rnsbox-*-${{ env.VARIANT }}-image
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          VER="${{ github.event.inputs.version }}"
          [ -z "$VER" ] && VER="r$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}"
          mkdir -p rel
          {
            echo "Automated RNSBox **$VARIANT** build from \`${GITHUB_SHA:0:7}\` (branch \`${GITHUB_REF_NAME}\`)."
            echo
            echo "| Board | Image | sha256 |"
            echo "|---|---|---|"
            for d in dist/*/; do
              board=$(basename "$d" | sed "s/^rnsbox-//; s/-$VARIANT-image\$//")
              xz=$(ls "$d"/*.img.xz 2>/dev/null | head -1)
              [ -n "$xz" ] || { echo "::error::no .img.xz in $d"; exit 1; }
              cp "$xz" rel/
              sum=$(awk '{print $1}' "$d/SHA256SUMS")
              echo "| $board | \`$(basename "$xz")\` | \`$sum\` |"
            done
            echo
            echo "Flash the image for your board to a microSD:"
            echo '```'
            echo "xz -d rnsbox-<board>-$VARIANT.img.xz"
            echo "sudo dd if=rnsbox-<board>-$VARIANT.img of=/dev/sdX bs=4M conv=fsync status=progress"
            echo '```'
            echo
            echo "Default web admin: http://10.42.0.1 (admin/admin); ssh root@10.42.0.1 (root/admin)."
          } > /tmp/notes.md
          cd rel
          if gh release view "$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VER" --repo "${{ github.repository }}" --clobber *.img.xz
          else
            gh release create "$VER" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "RNSBox $VER" --notes-file /tmp/notes.md *.img.xz
          fi
          cat /tmp/notes.md

      - name: One-off cleanup — remove the two per-board releases this scheme replaced
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # remove this step after it has run once
          for t in r2026.09.28-fb5b1ab-rpi0-2w r2026.09.28-fb5b1ab-licheerv-nano; do
            gh release delete "$t" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done
