name: build-images

# One matrix entry per board. Every board uses the same external-Buildroot
# flow (see build.sh): a defconfig plus a board post-image script. Adding a
# board means adding its defconfig and a line in the changes job's board
# map, nothing else.
#
# A push build only builds the boards the change can reach (the `changes`
# job maps changed paths to boards); a manual workflow_dispatch always
# builds every board.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (blank = r<date>-<shortsha>)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'board/**'
      - 'configs/**'
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    # Path -> boards map, so a push only spends runners on the boards it can
    # affect. Anything shared (package/, board/common/, scripts/, build.sh,
    # the workflow, base.config) selects every board; board trees and board
    # configs select the boards that use them (the Sophgo boards stack:
    # sg2000/sophgo trees feed every sg200x board).
    runs-on: ubuntu-24.04
    outputs:
      boards: ${{ steps.pick.outputs.boards }}
    steps:
      - name: Checkout rnsbox (the external tree)
        uses: actions/checkout@v4
        with:
          path: rnsbox
          fetch-depth: 0

      - name: Pick boards touched by this change
        id: pick
        working-directory: rnsbox
        run: |
          set -eu
          ALL="rpi-universal pc-x86_64 orangepi-r1 milkv-duo-cv1800b-rv64 \
              sg2000-duomodule01-rv64 sg2000-duomodule01-arm64 \
              sg2002-licheerv-nano-rv64 sg2002-licheerv-nano-arm64 \
              sg2002-duo256m-rv64 \
              sg2000-duo-s-rv64 sg2000-duo-s-arm64"
          COMMON="package board/common scripts build.sh .github/workflows/build.yml configs/base.config"

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "manual dispatch — building every board"
            files=$(git ls-files)
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "::warning::no resolvable before-sha — treating everything as changed"
              files=$(git ls-files)
            else
              files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            fi
          fi

          hit() {  # $1 file, $2 space-separated dir/file prefixes
            for p in $2; do
              case "$1" in "$p"|"$p"/*) return 0 ;; esac
            done
            return 1
          }

          match() {  # echo the boards whose prefixes any changed file hits
            local pats_rpi="board/raspberrypi configs/boards/rpi_universal.config configs/rnsbox_rpi_universal_defconfig"
            local pats_pc="board/pc configs/boards/pc_x86_64.config configs/rnsbox_pc_x86_64_defconfig"
            local pats_opi="board/orangepi-r1 configs/boards/orangepi_r1.config configs/rnsbox_orangepi_r1_defconfig"
            local pats_duo="board/milkv-duo board/sophgo configs/boards/milkv_duo_cv1800b.config configs/rnsbox_milkv_duo_cv1800b_defconfig"
            local pats_mod="board/sg2000 board/sophgo configs/boards/sg2000_duomodule01.config configs/rnsbox_sg2000_duomodule01_defconfig"
            local pats_mod_arm64="board/sg2000 board/sg2000-duomodule01-arm64 board/sophgo configs/boards/sg2000_duomodule01_arm64.config configs/rnsbox_sg2000_duomodule01_arm64_defconfig"
            local pats_lichiee="board/sg2000 board/sg2002 board/sophgo configs/boards/licheerv_nano.config configs/rnsbox_licheerv_nano_defconfig"
            local pats_lichiee_arm64="board/sg2000 board/sg2002 board/sg2002-licheerv-nano-arm64 board/sophgo configs/boards/sg2002_licheerv_nano_arm64.config configs/rnsbox_sg2002_licheerv_nano_arm64_defconfig"
            local pats_256m="board/sg2000 board/sg2002-duo256m board/sophgo configs/boards/duo256m.config configs/rnsbox_duo256m_defconfig"
            local pats_duos="board/sg2000 board/sg2000-duo-s board/sophgo configs/boards/duo_s.config configs/rnsbox_duo_s_defconfig"
            local pats_duos_arm64="board/sg2000 board/sg2000-duo-s-arm64 board/sophgo configs/boards/duo_s_arm64.config configs/rnsbox_duo_s_arm64_defconfig"
            local out=""
            local f
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              hit "$f" "$pats_rpi"     && out="$out rpi-universal"
              hit "$f" "$pats_pc"      && out="$out pc-x86_64"
              hit "$f" "$pats_opi"     && out="$out orangepi-r1"
              hit "$f" "$pats_duo"     && out="$out milkv-duo-cv1800b-rv64"
              hit "$f" "$pats_mod"     && out="$out sg2000-duomodule01-rv64"
              hit "$f" "$pats_mod_arm64" && out="$out sg2000-duomodule01-arm64"
              hit "$f" "$pats_lichiee" && out="$out sg2002-licheerv-nano-rv64"
              hit "$f" "$pats_lichiee_arm64" && out="$out sg2002-licheerv-nano-arm64"
              hit "$f" "$pats_256m"    && out="$out sg2002-duo256m-rv64"
              hit "$f" "$pats_duos"    && out="$out sg2000-duo-s-rv64"
              hit "$f" "$pats_duos_arm64" && out="$out sg2000-duo-s-arm64"
            done
            echo "$out"
          }

          picked=""
          if hit_all=$(printf '%s\n' "$files" | while IFS= read -r f; do
              [ -n "$f" ] || continue
              hit "$f" "$COMMON" && echo common
            done); [ -n "$hit_all" ]; then
            picked="$ALL"
          else
            # per-board match, dedup, keep the ALL order
            raw=$(printf '%s\n' "$files" | match)
            for b in $ALL; do
              case " $raw " in *" $b "*) picked="$picked $b" ;; esac
            done
          fi

          json="["
          first=1
          for b in $ALL; do
            case " $picked " in *" $b "*) ;;
              *) continue ;;
            esac
            [ $first -eq 1 ] || json="$json,"
            json="$json\"$b\""
            first=0
          done
          json="$json]"
          echo "picked:$json" | sed 's/^/>> /'
          echo "boards=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.changes.outputs.boards) }}
    env:
      BOARD: ${{ matrix.board }}
      IMGDIR: /mnt/rnsbox/out/${{ matrix.board }}/images
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          docker-images: true
          large-packages: false
          haskell: false
          swap-storage: false

      - name: Disk + memory before
        run: |
          echo "## disk"; df -h / /mnt
          echo "## mem"; free -h
          echo "## cpu"; nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget curl cpio unzip rsync bc file ccache \
            python3 python3-dev python3-setuptools \
            libssl-dev flex bison gawk texinfo help2man gettext \
            autoconf automake libtool pkg-config cmake ninja-build \
            libncurses-dev device-tree-compiler u-boot-tools \
            genext2fs dosfstools mtools parted squashfs-tools jq scons

      - name: Checkout rnsbox (the external tree)
        uses: actions/checkout@v4
        with:
          path: rnsbox

      - name: Verify generated defconfigs are current
        run: rnsbox/scripts/gen-defconfigs.sh --check

      - name: Verify overlays carry no accidental duplicates
        run: rnsbox/scripts/check-overlap.sh

      - name: Prepare scratch on /mnt
        run: |
          sudo mkdir -p /mnt/rnsbox/upstream /mnt/rnsbox/out /mnt/dl /mnt/tmp
          sudo chown -R "$USER":"$USER" /mnt/rnsbox /mnt/dl /mnt/tmp

      - name: Pin the buildroot source cache key
        id: brsrc
        run: echo "sha8=$(grep -m1 '^UPSTREAM_COMMIT=' rnsbox/build.sh | cut -d'"' -f2 | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Cache the buildroot source tree
        # Every board clones the same pinned buildroot; caching the clone
        # (shared key) turns that into a checkout.
        uses: actions/cache@v4
        with:
          path: /mnt/rnsbox/upstream
          key: brsrc-${{ steps.brsrc.outputs.sha8 }}
          restore-keys: brsrc-

      - name: Cache buildroot downloads (shared)
        uses: actions/cache@v4
        with:
          path: /mnt/dl
          key: br-dl-${{ hashFiles('rnsbox/configs/**', 'rnsbox/package/**') }}
          restore-keys: |
            br-dl-

      - name: Cache the compiler cache
        # BR2_CCACHE=y in base.config; the build step points BR2_CCACHE_DIR
        # here so object files survive across runs (kernel + python are the
        # big wins). Always-unique key, prefix restore: each run saves a
        # fresh snapshot, jobs restore the latest one for their board.
        uses: actions/cache@v4
        with:
          path: /mnt/rnsbox/out/${{ matrix.board }}/ccache
          key: ccache-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.board }}-

      - name: Build ${{ matrix.board }} (up to 2 attempts)
        env:
          UPSTREAM_BASE: /mnt/rnsbox/upstream
          BR2_DL_DIR: /mnt/dl
          BR2_CCACHE_DIR: /mnt/rnsbox/out/${{ matrix.board }}/ccache
          TMPDIR: /mnt/tmp
          ODIR: /mnt/rnsbox/out/${{ matrix.board }}
        run: |
          export PATH=/usr/sbin:/sbin:$PATH
          cd rnsbox
          START=$(date +%s)
          set -o pipefail
          status=1
          for attempt in 1 2; do
            if [ "$attempt" -gt 1 ]; then
              echo "::warning::attempt 1 failed (exit $status) - retrying"
              cp /mnt/tmp/build.log /mnt/tmp/build.log.try1
            fi
            /usr/bin/time -v ./build.sh "$BOARD" 2>&1 | tee /mnt/tmp/build.log
            status=$?
            echo ">> attempt $attempt exit: $status"
            [ "$status" -eq 0 ] && break
          done
          echo "BUILD_SECONDS=$(( $(date +%s) - START ))" | tee -a "$GITHUB_ENV"
          exit $status

      - name: Build-log tail on failure
        if: failure()
        run: |
          {
            if [ -f /mnt/tmp/build.log.try1 ]; then
              echo "### build.log tail - attempt 1"
              echo '```'; tail -n 60 /mnt/tmp/build.log.try1; echo '```'
            fi
            echo "### build.log tail - last attempt"
            echo '```'; tail -n 150 /mnt/tmp/build.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk after + image + timing
        if: always()
        run: |
          echo "## disk after"; df -h / /mnt
          echo "## build minutes: $(( ${BUILD_SECONDS:-0} / 60 ))"
          echo "## images"; ls -lh "$IMGDIR" 2>/dev/null || echo "(no images dir)"
          echo "## last 40 build.log lines"; tail -n 40 /mnt/tmp/build.log 2>/dev/null || true

      - name: Package image
        if: success()
        run: |
          set -eux
          IMG="$IMGDIR/rnsbox-$BOARD.img"
          [ -f "$IMG" ] || { echo "::error::no $IMG"; ls -lh "$IMGDIR"; exit 1; }
          STAGE="$RUNNER_TEMP/pkg"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -v "$IMG" "$STAGE/"
          cd "$STAGE"
          if ! xz -T2 -9 -k -f "$(basename "$IMG")"; then
            echo "::warning::xz -9 failed; trying -6"
            xz -T2 -6 -k -f "$(basename "$IMG")"
          fi
          sha256sum *.img.xz > SHA256SUMS
          ls -lh
          echo "PKGDIR=$STAGE" >> "$GITHUB_ENV"

      - name: Upload image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rnsbox-${{ matrix.board }}-image
          path: |
            ${{ env.PKGDIR }}/*.img.xz
            ${{ env.PKGDIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.board }}
          path: /mnt/tmp/build.log*
          if-no-files-found: warn
          retention-days: 7

  release:
    # One release per run; matrix jobs only upload artifacts. A push run is a
    # pre-release (possibly partial: only the boards the change touched), a
    # manual workflow_dispatch is a full release.
    name: release (built boards)
    needs: [changes, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Collect images from the built boards
        uses: actions/download-artifact@v4
        with:
          pattern: rnsbox-*-image
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          VER="${{ github.event.inputs.version }}"
          [ -z "$VER" ] && VER="r$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then IS_PRE=true; else IS_PRE=false; fi
          mkdir -p rel
          {
            echo "Automated RNSBox build from \`${GITHUB_SHA:0:7}\` (branch \`${GITHUB_REF_NAME}\`)."
            echo
            if [ "$IS_PRE" = true ]; then
              echo "> Auto-build: marked as a **pre-release**. Full releases are cut by running this workflow manually."
              echo
            fi
            echo "| Image | sha256 |"
            echo "|---|---|"
            for d in dist/*/; do
              for xz in "$d"*.img.xz; do
                [ -e "$xz" ] || { echo "::error::no image in $d"; exit 1; }
                cp "$xz" rel/
                echo "| \`$(basename "$xz")\` | \`(see SHA256SUMS below)\` |"
              done
            done
            echo
            echo "### SHA256"
            echo '```'
            cat dist/*/SHA256SUMS
            echo '```'
            echo
            echo "Flash the image for your board to a microSD:"
            echo '```'
            echo "xz -d rnsbox-<board>.img.xz"
            echo "sudo dd if=rnsbox-<board>.img of=/dev/sdX bs=4M conv=fsync status=progress"
            echo '```'
            echo
            echo "Web admin: http://10.42.0.1 (admin/admin; change it after first login)."
            echo "SSH: ssh admin@10.42.0.1 (admin/admin; change the password in Settings)."
          } > /tmp/notes.md
          cd rel
          if gh release view "$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VER" --repo "${{ github.repository }}" --clobber *.img.xz
            gh release edit "$VER" --repo "${{ github.repository }}" "--prerelease=$IS_PRE"
          else
            gh release create "$VER" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "RNSBox $VER" --notes-file /tmp/notes.md "--prerelease=$IS_PRE" *.img.xz
          fi
          cat /tmp/notes.md
