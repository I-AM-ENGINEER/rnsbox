# NomadNet — LXMF propagation node + pages server. On by default on every
# board except the 64 MB CV1800B and MT7628 images: set enabled=no and
# reboot to turn the node off. Pages live in $configdir/storage/pages/
# (default /var/lib/nomadnetwork). Attaches to rnsd's shared instance;
# clock re-dating handled by the init script.

enabled=yes
#configdir=/var/lib/nomadnetwork
