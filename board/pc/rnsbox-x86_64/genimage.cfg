# RNSBox PC/VM disk layout — one raw BIOS disk image (disk.img):
#
#   offset 0     : MBR (partition table + grub boot.img in the boot code area;
#                  the 440..512 hole keeps the disk signature/entries intact)
#   offset 512   : grub core.img (i386-pc: biosdisk, ext2, part_msdos, linux)
#   first part.  : rootfs.ext4 — /, carries /boot/bzImage + /boot/grub/grub.cfg
#
# grub-bios modules live inside rootfs (TARGET_DIR/lib/grub/i386-pc); boot.img
# is copied next to the image by post-build.sh, grub.img is built by the
# grub2 package into BINARIES_DIR.

image disk.img {
	hdimage {
	}

	partition boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
