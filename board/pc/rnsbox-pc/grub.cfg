# RNSBox PC/VM grub config. The disk is a plain BIOS MBR disk (grub boot.img
# + core.img in the first 512 bytes and the post-MBR gap, one ext4 root
# partition carrying /boot/bzImage) — the same image boots in QEMU,
# VirtualBox (BIOS/IDE-or-SATA) and VMware as a normal disk.
#
# Consoles: tty0 (VGA — the VirtualBox/VMware window) and ttyS0 115200
# (QEMU -nographic / scripts/run-pc-vm.sh). ttyS0 last: /dev/console and the
# init-scripts' stdout land on the serial line, where the smoke test reads
# them; printk goes to both consoles either way.

set default="0"
set timeout="3"

menuentry "RNSBox (Reticulum router, PC/VM)" {
	linux /boot/bzImage root=/dev/sda1 rootwait console=tty0 console=ttyS0,115200
}

menuentry "RNSBox (single console: serial only)" {
	linux /boot/bzImage root=/dev/sda1 rootwait console=ttyS0,115200
}
