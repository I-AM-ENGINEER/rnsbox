# SLIP-over-UART link to a WiFi-HaLow (RNode) modem; enable from the portal
# (Reticulum tab). PC/VM variant: there is no PL011 — the "modem" is a host
# pty peer attached to ttyS1 by `scripts/run-pc-vm.sh --slip-pty` (or a
# second QEMU running an RNode emulator); baud is irrelevant over a pty.
# Then route Reticulum through it (RNS skips the block without enabled!):
#
#   [[HaLow]]
#     type = TCPClientInterface
#     enabled = yes
#     target_host = 192.168.7.2      # = peer_ip below
#     target_port = 4242             # modem's TCP Radio Bridge port

enabled=no
device=/dev/ttyS1
baud=2000000
local_ip=192.168.7.1
peer_ip=192.168.7.2
