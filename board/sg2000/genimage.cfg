# RNSBox sg2000 (Duo Module 01 EVB) image: p1 boot FAT (vendor
# fip.bin + our FIT + the usb.* gadget flags S10usbdev reads), p2 ext4
# rootfs (the vendor u-boot bootargs hardcode root=/dev/mmcblk0p2). Shapes
# copied from the vendor cvitek-universal flow
# (build/tools/common/sd_tools/genimage_rootless.cfg) and the proven
# milkv-duo board dir.

image boot.vfat {
        vfat {
                label = "boot"
                files = {
                        "fip.bin",
                        "boot.sd",
                        "usb.dev",
                        "usb.ncm",
                        "usb.ncm.mac",
                        "usb.idVendor",
                        "usb.idProduct",
                        "usb.bcdDevice",
                        "usb.manufacturer",
                        "usb.product",
                        "hostname",
                        "ver",
                }
        }
        size = 16M
}

image sdcard.img {
        hdimage {
        }

        partition boot {
                partition-type = 0x0C
                bootable = "true"
                image = "boot.vfat"
        }

        partition rootfs {
                partition-type = 0x83
                image = "rootfs.ext4"
        }
}
