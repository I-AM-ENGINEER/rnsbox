# Scheduled tasks — portal-managed. rnsd_restart_days: 0=off, 1..7 = daily
# rnsd restart at rnsd_restart_time (default 04:00; RAM hygiene).
# update_check: daily rnsd check + wheel download. update_install: also install
# it automatically (off by default; rolls back if rnsd does not start).
# Hourly NTP resync is always scheduled.

rnsd_restart_days=0
rnsd_restart_time=04:00
update_check=yes
update_install=no
