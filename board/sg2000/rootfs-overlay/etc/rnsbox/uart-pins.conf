# Pad mux written by S31slip before ldattach, one line per UART:
#   <device>=<register>:<raw fmux value>[,<register>:<value>...]
#
# Values come from the vendor cv181x pinmux table (SG2000/SG2002):
#   UART1 pads XGPIOA[28] TX / XGPIOA[29] RX -> fmux 1
#   UART2 on the EVB header pins 11/13 (XGPIOB[11]/[12], pads VIVO_D10/D9)
#   -> fmux 7 (the SG2000 pinout table; fmux 0 is the GPIO function and
#   fmux 5 would route the pads to UART4). Must match the kernel DTS
#   uart2_cfg pinctrl state: on kernels with CONFIG_DEVMEM this write is
#   real, and a mismatching value here would un-mux the pads the DT just
#   muxed (seen live: fmux 0 left the SLIP modem line dead).
# The EVB's UART1 RX pad is shared with the blue LED, so UART2 is the
# usable header port. Add a line here to route another UART without
# editing the init script (uart_mux=no in slip.conf disables all writes).
/dev/ttyS1=0x03001070:1,0x03001074:1
/dev/ttyS2=0x030010c0:7,0x030010c8:7
