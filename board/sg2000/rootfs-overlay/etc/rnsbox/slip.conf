# SLIP-over-UART link to a WiFi-HaLow (RNode) modem; enable from the portal
# (Reticulum tab). Wiring: CVITEK UART1 XGPIOA[28] TX / XGPIOA[29] RX,
# 3.3 V, common ground; baud must match the modem (2000000 both ends — the
# kernel DTS clocks the SG2000 UARTs from 96 MHz so this divides exactly).
# Then route Reticulum through it (RNS skips the block without enabled!):
#
#   [[HaLow]]
#     type = TCPClientInterface
#     enabled = yes
#     target_host = 192.168.7.2      # = peer_ip below
#     target_port = 4242             # modem's TCP Radio Bridge port

enabled=no
device=/dev/ttyS1
baud=2000000
local_ip=192.168.7.1
peer_ip=192.168.7.2
# XGPIOA[28]/[29] fmux for UART1 on the SG200x boards (see S31slip)
uart1_mux=yes
