# NomadNet — LXMF propagation node + pages server. Off by default: set
# enabled=yes and reboot, or /etc/init.d/S83nomadnet start. Pages live in
# $configdir/storage/pages/ (default /var/lib/nomadnetwork). Attaches to
# rnsd's shared instance; clock re-dating handled by the init script.

enabled=no
#configdir=/var/lib/nomadnetwork
