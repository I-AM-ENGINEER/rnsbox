# lxmd — LXMF propagation node (store-and-forward relay). Off by default:
# set enabled=yes and reboot, or /etc/init.d/S85lxmd start. Won't start while
# free RAM is below min_free_mb (protects rnsd from OOM). Node settings
# (store size, name, peering): /etc/lxmd/config.

enabled=no
min_free_mb=60
