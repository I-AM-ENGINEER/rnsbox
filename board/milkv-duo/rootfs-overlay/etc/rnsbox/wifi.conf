# WiFi — read by S35wifi, managed by the portal WiFi tab. Modes:
#   off | sta | ap | sta+ap
# sta+ap: single radio; the STA follows the AP band and the AP inherits the
# STA's channel/width. The AP is bridged into br-lan (no subnet of its own).
# Harmless on boards without a radio.

mode=off

# --- STA ---
sta_ssid=
sta_psk=
# sta_security: wpa2 | wpa3 | wpa2+wpa3 | open
sta_security=wpa2
# sta_band: auto | 2.4 | 5 (empty/auto = no band restriction)
sta_band=auto
#sta_hidden=0
#sta_country=00

# --- AP ---
# ap_ssid empty -> the hotspot is named after the device hostname
# (rnsbox-xxxxxx) and follows the boot rename.
ap_ssid=
# ap_psk: 8..63 chars, no '#'/'"'. Ships empty on purpose; portal and
# S35wifi refuse empty/short/known-default PSKs. This file is 0600.
ap_psk=
# ap_security: wpa2 | wpa3 | wpa2+wpa3 (no open hotspot)
ap_security=wpa3
# ap_band: 2.4 | 5
ap_band=2.4
# ap_standard: auto | n | ac | ax (ac needs 5 GHz; 80 MHz needs ac/ax)
ap_standard=auto
# ap_width: 20 | 40 | 80
ap_width=20
# ap_channel: 1..13 (2.4 GHz), 36..165 (5 GHz), or auto (ACS)
ap_channel=6
# ap_htmode: legacy alias for 20/40 MHz; ap_width wins when present
ap_htmode=ht20
#ap_hidden=0

# --- TX power (STA and AP): auto = chip max, or 1..18 dBm
# (AIC8800 OFDM ceiling ~18 dBm). Lower = less heat/range.
tx_power=auto
