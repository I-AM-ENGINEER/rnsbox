# WAN-open ports, one per line: <proto> <port> # comment (portal-managed).
#
# The WAN/LAN split is a convenience topology, not a security perimeter: this
# box is not assumed to be plugged into an untrusted network. Every management
# service is reachable by default. SSH only listens at all while Settings ->
# SSH is enabled; this entry is the WAN side of that same service.
tcp 22  # SSH (daemon runs while Settings -> SSH is enabled)
tcp 80  # web admin UI (also opens the modem page on :8081)
tcp 4242  # rnsd TCPServerInterface for WAN peers
