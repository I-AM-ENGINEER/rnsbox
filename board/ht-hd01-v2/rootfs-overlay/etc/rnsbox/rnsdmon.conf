# rnsd down-watchdog: reboot when rnsd stays down this long (S46wanwatch)
enabled=yes
down_limit=3600
# Memory watchdog (S83mon/rnsbox-mon): restart rnsd when the used share of RAM
# (MemTotal - MemAvailable) stays at or above mem_threshold for two checks.
# Portal-managed (Reticulum -> Maintenance). 50..95 %.
mem_enabled=yes
mem_threshold=90
