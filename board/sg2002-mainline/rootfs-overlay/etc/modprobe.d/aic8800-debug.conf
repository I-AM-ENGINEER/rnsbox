# Keep the AIC8800 WiFi/BT driver from logging every packet/message at
# KERN_DEBUG: that flood is written to the serial console and costs ~40% CPU
# in the kernel printk thread on this SoC.
options aic8800_fdrv aicwf_dbg_level=0

# The BSP module logs every SDIO bus message too (rwnx_send_msg /
# rwnx_rx_handle_msg AICWFDBG lines); same bit field as fdrv.
options aic8800_bsp aicwf_dbg_level_bsp=0
