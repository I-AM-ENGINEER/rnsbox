# WAN uplink — portal-managed. interface: auto (eth0 + WiFi client, metric
# picks) | eth0 | wlan0. mode: dhcp | static (fields below, eth0 only).
# nat: yes (default) masquerades LAN 10.42.0.0/24 out the WAN; no routes it
# without source NAT (the upstream needs a static route back to 10.42.0.0/24,
# otherwise LAN clients reach only the box).
# Apply hand edits: S30eth restart + S60routing restart (portal does both).

interface=auto
mode=dhcp
nat=yes
