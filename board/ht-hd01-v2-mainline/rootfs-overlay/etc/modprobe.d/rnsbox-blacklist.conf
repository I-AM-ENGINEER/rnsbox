# Modules this board never uses. The image already loads only
# mt7628-esw, morse, dot11ah, mt7603e, sch_fq and zram/lz4, so these were
# not resident anyway; the blacklist keeps a hotplug/modalias event or a
# stray modprobe from pulling them in later on the 64 MB target.
#
# cdc_ether / rndis_host are deliberately NOT listed: the USB-C port's
# Ethernet (SR9900) is a USB net device.
blacklist ppp_generic
blacklist pppoe
blacklist ppp_async
blacklist pppox
blacklist batman_adv
blacklist usb_storage
blacklist i2c_dev
blacklist cls_u32
blacklist act_gact
