# Every RNSBox's LAN address is the same (10.42.0.1, br-lan): answer ARP for
# it only on the iface that owns it (arp_ignore=1) and announce only from the
# outgoing iface's address (arp_announce=2). Applied by S02sysctl.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
