# rns-time — time over Reticulum. Read by /etc/init.d/S88rnstime and edited
# by the portal (Settings -> Time). Flat key=value, one per line.
#
# enabled        run the client loop at boot
# servers        destination hash(es) of rns-time servers, comma/space separated
# interval       seconds between client attempts (60..86400)
# step_threshold step the clock only when |offset| >= this many seconds
# serve          also serve time to the mesh from upstream NTP
# upstream       comma-separated NTP servers for serve=yes
#
# The default destination is the reference minimal server (msk); replace it
# with your own server's hash, or leave servers blank to disable syncing.
enabled=yes
servers=34709d9ce5c4236a421b04864b829fb1
interval=300
step_threshold=0.5
serve=no
upstream=pool.ntp.org,time.google.com
