# WAN-open ports, one per line: <proto> <port> # comment (portal-managed).
# SSH (tcp 22) is deliberately NOT here: sshd is off unless the user enables
# it in the portal (Settings -> SSH), and its WAN side only opens by adding
# tcp 22 under Network -> Open ports. LAN-side SSH needs no entry: the LAN
# interfaces are accepted wholesale by the firewall.

tcp 80  # web admin UI
tcp 4242  # rnsd TCPServerInterface for WAN peers
