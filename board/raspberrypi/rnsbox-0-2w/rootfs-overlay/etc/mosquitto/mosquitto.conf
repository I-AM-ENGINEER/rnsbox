# MQTT broker: HaLow nodes publish telemetry here (S87halowtlm collects it)
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest syslog
# relay the node telemetry to the map/telemetry server when the box has an uplink
connection halow-map
address telemetry.rnode-halow.ru:1883
topic rnode-halow/telemetry out 0 "" ""
remote_username rnode-halow
remote_password rnode-halow
bridge_attempt_unsubscribe false
notifications false
restart_timeout 30 300
