# RNSBox ntp.conf — IP-only NTP servers, no DNS dependency.
#
# Read by the ntpd daemon (S49ntp, always running, -g) and by S45ntpsync's
# NTP one-shot, which runs `ntpdate -u -b` against the same server lines as
# soon as a route to one of them appears (a local server on a directly
# connected subnet counts, e.g. a GPS time server on a LAN-, HaLow- or
# WiFi-only mesh with no default route), and again whenever the routes
# change, then writes the time to the RTC if one is fitted. A server given by
# name needs a default route (DNS); on a mesh with no uplink give it as an IP
# address. The portal's Settings page edits the server lines; it keeps these
# comments but puts the servers first.
#
# Nothing waits for NTP: rnsd and friends run with or without a synced clock
# (Reticulum must work on meshes with no internet at all). Without a DS3231
# RTC (README.RNSBox.md) the clock starts at 1970 every boot until NTP or a
# browser sync sets it.
#
# Literal IPs because the one-shot runs the moment a route exists, which may
# be before DNS works. Anycast addresses from two operators, so one going
# down doesn't lose us sync: Cloudflare (162.159.200.1, 162.159.200.123) and
# Google (216.239.35.0, .4, .8, .12).

server 162.159.200.1   iburst
server 162.159.200.123 iburst
server 216.239.35.0    iburst
server 216.239.35.4    iburst
server 216.239.35.8    iburst
server 216.239.35.12   iburst

# Standard tightening - don't act as a public NTP server for anyone
restrict default nomodify nopeer noquery limited kod
restrict 127.0.0.1
restrict [::1]
