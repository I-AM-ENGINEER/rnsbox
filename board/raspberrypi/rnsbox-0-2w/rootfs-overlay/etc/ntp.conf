# RNSBox ntp.conf — IP-only NTP servers, no DNS dependency.
#
# Why: the Nano-e has no RTC, so the clock starts at 1970 every boot.
# rnsd refuses to start without /run/clock-synced, and S45ntpsync sets
# that flag only after a successful step against literal NTP IPs. Using
# pool.ntp.org from the daemon side would race DNS — which may not work
# until much later in boot.
#
# Pinning IPs from operators that publish stable anycast NTP addresses
# avoids the DNS dependency entirely. Mix providers so one going down
# doesn't lose us sync.

# Cloudflare time service (anycast, well-distributed)
server 162.159.200.1   iburst
server 162.159.200.123 iburst

# Google public NTP (anycast)
server 216.239.35.0   iburst
server 216.239.35.4   iburst
server 216.239.35.8   iburst
server 216.239.35.12  iburst

# Standard tightening - don't act as a public NTP server for anyone
restrict default nomodify nopeer noquery limited kod
restrict 127.0.0.1
restrict [::1]
