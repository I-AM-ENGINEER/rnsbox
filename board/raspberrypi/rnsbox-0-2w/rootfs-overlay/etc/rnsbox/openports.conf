# Open ports on this device's WAN-facing interface.
#
# One rule per line:
#   <proto>  <port>   [# comment]
#
# SSH (22), the web UI (80) and rnsd's TCPServerInterface (4242, so external
# Reticulum peers can connect in) ship as default entries, so the box is
# reachable on the WAN out of the box. Remove them here (or in the portal:
# Network -> Open ports) to close WAN access — the LAN side (br-lan: the
# USB-C link and the WiFi hotspot) always stays open.
# Managed by the rnsbox-portal UI (Network -> Open ports).
tcp 22  # SSH
tcp 80  # web admin UI
tcp 4242  # rnsd TCPServerInterface for WAN peers
