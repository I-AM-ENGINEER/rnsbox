# RNSBox WiFi config — read at boot by /etc/init.d/S35wifi.
#
# The Zero 2 W has an onboard 2.4 GHz WiFi/BT chip (brcmfmac; Bluetooth is
# disabled - the UART is reserved for the SLIP HaLow link).
#
# mode:
#   off       no WiFi (default)
#   sta       client only (join a network on wlan0) - the WAN uplink
#   ap        hotspot only (wlan0 runs hostapd)
#   sta+ap    concurrent: wlan0 = STA (WAN), uap0 = AP hotspot. One radio:
#             both share the STA's channel (the client is pinned to 2.4 GHz,
#             which is this chip's only band anyway).
#
# Managed by the rnsbox-portal WiFi tab. Apply hand-edits with:
#   /etc/init.d/S35wifi restart

mode=off

# --- STA (client) ---
sta_ssid=
sta_psk=
# sta_hidden=0      # 1 to scan for a hidden SSID
# sta_country=00    # regulatory domain; 00=world

# --- AP (hotspot) ---
ap_ssid=RNSBox-AP
ap_psk=changeme123
# ap_channel: 1..13, or "auto" (hostapd ACS picks the least-congested 2.4GHz
# channel; falls back to ch6 if the driver can't survey). In concurrent
# sta+ap mode the AP always follows the STA channel regardless of this
# (single radio) — the WiFi tab locks this field while concurrent.
ap_channel=6
# ap_htmode: ht20 (20 MHz, default) or ht40 (40 MHz — more throughput). In
# concurrent sta+ap mode the AP inherits the STA's actual channel AND width,
# falling back to HT20 if the HT40 AP fails to start.
ap_htmode=ht20
# ap_hidden=0
ap_ip=192.168.42.1
ap_dhcp_start=192.168.42.10
ap_dhcp_end=192.168.42.100

# --- TX power (radio-wide; applies to STA and AP) ---
# tx_power:
#   auto    driver default within the regulatory domain. Default.
#   <dBm>   integer cap — `iw set txpower fixed` (falls back to `limit` if
#           the driver rejects fixed).
tx_power=auto
