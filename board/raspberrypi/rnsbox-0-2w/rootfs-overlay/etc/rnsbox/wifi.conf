# WiFi — read by S35wifi, managed by the portal WiFi tab. Modes:
#   off | sta | ap | sta+ap
# sta+ap: single radio, client pinned to 2.4 GHz (must share the AP's
# channel); a 5 GHz-only upstream needs mode=sta. The AP is bridged into
# br-lan (no subnet of its own). Harmless on boards without a radio.

mode=off

# --- STA ---
sta_ssid=
sta_psk=
#sta_hidden=0
#sta_country=00

# --- AP ---
ap_ssid=RNSBox-AP
# ap_psk: WPA2, 8..63 chars, no '#'/'"'. Ships empty on purpose; portal and
# S35wifi refuse empty/short/known-default PSKs. This file is 0600.
ap_psk=
# ap_channel: 1..13 or auto (ACS); ignored in sta+ap (follows the STA)
ap_channel=6
# ap_htmode: ht20 | ht40; in sta+ap follows the STA's link
ap_htmode=ht20
#ap_hidden=0

# --- TX power (STA and AP): auto = chip max, or 1..18 dBm
# (AIC8800 OFDM ceiling ~18 dBm). Lower = less heat/range.
tx_power=auto
