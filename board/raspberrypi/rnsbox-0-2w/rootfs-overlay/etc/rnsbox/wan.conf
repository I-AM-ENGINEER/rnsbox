# WAN uplink config — managed by the rnsbox-portal Network tab.
#
# Flat key=value. Parsed by both the C++ portal (store.cpp, in
# /usr/sbin/rnsbox-portal — it rewrites this file on save) and the shell init
# scripts (S30eth configures eth0 unless interface=wlan0; S60routing picks
# the NAT ifaces).
#
# interface:  which iface(s) act as WAN (NAT masquerade + open ports attach here)
#   auto    - both eth0 and the wlan0 WiFi client are uplinks (default). The
#             kernel's route metric picks: eth0 while it has a cable and an
#             address, otherwise the WiFi client (W variant, WiFi tab ->
#             mode sta or sta+ap). Nothing to switch by hand when a cable is
#             plugged in or pulled out. On the Nano-e (no WiFi) this is eth0.
#   eth0    - onboard RJ45 only; a WiFi client never carries LAN traffic.
#   wlan0   - WiFi client only (W variant; addressed by S35wifi/dhcpcd, not
#             here). eth0 is then left unconfigured (no DHCP client, no address).
#   The box never changes this setting itself: eth0 or wlan0 stays pinned.
#
# mode:  how eth0 gets its IPv4 address (auto or eth0)
#   dhcp    - lease from the upstream router (default)
#   static  - use the address/prefix/gateway/dns fields below
#
# Static fields (only read when mode=static, only applied to eth0):
#   address   IPv4 address,         e.g. 192.168.1.50
#   prefix    netmask as CIDR bits, e.g. 24  (255.255.255.0)
#   gateway   upstream gateway,     e.g. 192.168.1.1
#   dns       space-separated DNS servers, e.g. 1.1.1.1 8.8.8.8
#
# Changes take effect after `/etc/init.d/S30eth restart` +
# `/etc/init.d/S60routing restart` (the portal does both on save), or a reboot.

interface=auto
mode=dhcp
