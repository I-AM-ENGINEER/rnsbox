# dhcpcd serves ONLY the WiFi client wlan0 (S35wifi's per-iface instance).
# eth0 = udhcpc (S30eth); br-lan/usb0/wlan1 = dnsmasq; no IPv4LL (a 169.254
# route would hijack the default route on link-down).

hostname
clientid

option rapid_commit
option domain_name_servers, domain_name, domain_search
option classless_static_routes
require dhcp_server_identifier
slaac private

noipv6
noipv6rs
noipv4ll

# Never lease from a DHCP server in our own LAN subnet (another RNSBox's
# hotspot serves 10.42.0.1); wlan0 stays without an address instead,
# exit-hook records it for the portal (/run/wifi-sta-conflict).
blacklist 10.42.0.0/24

# The only managed iface (deny wins over allow).
allowinterfaces wlan0
denyinterfaces lo eth0 br-lan usb0 wlan1 sl0
