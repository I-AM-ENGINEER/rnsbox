# RNSBox Orange Pi R1 SD image.
#
# p1 boot (FAT) : U-Boot boot.scr, zImage, DTB, and the gadget flag files
#                 read by S10usbdev (/boot/usb.*).
# p2 rootfs     : single ext4 slot, grown to fill the card by S02resizefs.
#
# U-Boot's SPL occupies the first 8 KiB of the raw card and the GPT lives at
# 1 MiB, so the two do not collide (same layout the upstream orangepi_r1
# defconfig uses).
image boot.vfat {
	vfat {
		files = {
			"zImage",
			"sun8i-h2-plus-orangepi-r1.dtb",
			"boot.scr",
			"usb.dev",
			"usb.ncm",
			"usb.ncm.mac",
			"usb.idVendor",
			"usb.idProduct",
			"usb.bcdDevice",
			"usb.manufacturer",
			"usb.product",
			"hostname"
		}
	}

	size = 32M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
		# default GPT location conflicts with the SPL at 8 KiB
		gpt-location = 1M
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K # 1MB - 8KB
	}

	partition boot {
		partition-type-uuid = F
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type-uuid = L
		image = "rootfs.ext4"
	}
}
