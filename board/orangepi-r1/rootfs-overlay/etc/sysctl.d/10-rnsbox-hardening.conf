# Protect sticky world-writable dirs (/tmp) from non-root symlink/hardlink/
# FIFO/regular-file planting (dnsmasq runs as nobody). Applied by S02sysctl.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_regular = 2
fs.protected_fifos = 2

# Kernel logs and pointer values only for root. The unprivileged `admin`
# account (SSH) gains nothing from dmesg/kallsyms/proc pointers; nothing on
# the box (portal, init scripts, dnsmasq) reads either as non-root.
# Applied by S02sysctl.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
