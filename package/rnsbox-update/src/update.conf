# RNSBox system (OS image) update settings — edited by the portal
# Updates tab and by rnsbox-sysupdate (next_check is managed). Manual
# edits are fine; values are documented in docs/AUTO-UPDATE.md.
enabled=yes
provider=github-releases
repo=I-AM-ENGINEER/rnsbox
url=
board=auto
token=
allow_prerelease=yes
allow_insecure_http=no
auto_apply=no
interval_min_days=7
interval_max_days=14
next_check=0
sig_require=no
sig_key=/etc/rnsbox/keys/update.pub
