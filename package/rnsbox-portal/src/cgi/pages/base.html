<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__ — __HOSTNAME__</title>
  <link rel="stylesheet" href="/style.css?v=__CSSV__">
  <script>
  // Theme: dark by default; the top-bar toggle flips and persists it.
  // Set before first paint so the page never flashes the wrong palette.
  (function(){
    var t = 'dark';
    try { t = localStorage.getItem('rnsbox-theme') || 'dark'; } catch(e){}
    if (t !== 'light' && t !== 'dark') t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">⬢</span>
      <span class="brand-name">RNSBox</span>
      <span class="brand-host">__HOSTNAME__</span>
    </div>
    <nav class="topnav">
      <!-- No username chip: the portal has exactly one account (admin), so
           showing it in the corner is noise. -->
      <button type="button" class="logout theme-toggle" id="theme-toggle"
              title="Switch dark / light theme">◐</button>
      <!-- POST form, not a link: /logout is POST-only (a GET must not change state) -->
      <form class="logout-form" method="post" action="__BASE__/logout">
        <button type="submit" class="logout">Logout</button>
      </form>
    </nav>
  </div>
</header>
<script>
(function(){
  var b = document.getElementById('theme-toggle');
  if (!b) return;
  function label(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    b.textContent = dark ? '☾' : '☀';
    b.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
  }
  b.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var nxt = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nxt);
    try { localStorage.setItem('rnsbox-theme', nxt); } catch(e){}
    label();
  });
  label();
})();
</script>
<div class="page">
  <aside class="sidebar">
    <a href="__BASE__/" class="__ACT_dashboard__">Dashboard</a>
    <a href="__BASE__/network" class="__ACT_network__">Network</a>
    __NAV_WIFI__
    <a href="__BASE__/reticulum" class="__ACT_reticulum__">Reticulum</a>
    __NAV_CONSOLE__
    __NAV_NOMADNET__
    <!-- TODO(owners-decision): Updates hidden from the nav (raw A/B updater,
         not ready for prime time) but NOT removed: /updates and its POSTs
         stay reachable by direct link. Decide: finish it or drop the routes. -->
    <a href="__BASE__/updates" class="__ACT_updates__" hidden>Updates</a>
    <a href="__BASE__/settings" class="__ACT_settings__">Settings</a>
    <a href="__BASE__/donate" class="__ACT_donate__">Donate</a>
  </aside>
  <main class="content">
    __FLASH__
    __CONTENT__
  </main>
</div>
<footer class="sitefoot">
  <div class="sitefoot-inner">
    <span class="foot-brand"><span class="logo">⬢</span> RNSBox · open-source Reticulum router</span>
    <a class="foot-donate" href="__BASE__/donate">Donate</a>
  </div>
</footer>
</body>
</html>
