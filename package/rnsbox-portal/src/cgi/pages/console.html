<h2>Console</h2>

<section class="card">
  <p class="muted">TTY login on the box. User <code>admin</code>; the password
  is the admin password (factory default <code>admin</code>). The session is a
  real PTY, so the login and zsh behave like a serial console.</p>
  <pre id="term" class="term-screen"></pre>
  <form id="cform" class="row-form">
    <input id="cline" name="line" type="text" autocomplete="off" autofocus
           placeholder="type a line and press Enter">
    <button type="submit" class="btn-primary">Send</button>
    <button type="button" class="btn" onclick="sendKey('\u0003')">Ctrl-C</button>
  </form>
  <p class="muted">The screen refreshes every second. The TTY does not echo the
  password.</p>
</section>

<script>
(function(){
  var term = document.getElementById('term');
  var cline = document.getElementById('cline');
  function poll(){
    fetch('__BASE__/console/screen', {cache:'no-store'}).then(function(r){
      return r.ok ? r.text() : null;
    }).then(function(t){
      if (t !== null && t !== term.textContent) {
        term.textContent = t;
        term.scrollTop = term.scrollHeight;
      }
    }).catch(function(){});
  }
  function sendLine(v){
    var body = new URLSearchParams();
    body.set('line', v);
    fetch('__BASE__/console/input', {method:'POST', body: body}).then(function(){
      cline.value = '';
      cline.focus();
      setTimeout(poll, 200);
    }).catch(function(){});
  }
  document.getElementById('cform').addEventListener('submit', function(e){
    e.preventDefault();
    sendLine(cline.value);
  });
  window.sendKey = function(k){ sendLine(k); };
  setInterval(poll, 1000);
  poll();
})();
</script>
