<div class="login-box">
  <div class="login-brand">
    <span class="logo">⬢</span>
    <span class="brand-name">RNSBox</span>
  </div>
  <h1>Sign in</h1>
  <form method="post" action="__ACTION__">
    <input type="hidden" name="next" value="__NEXT__">
    <label>Username
      <input type="text" name="username" autofocus autocomplete="username" value="admin">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password">
    </label>
    <button type="submit" class="btn-primary">Sign in</button>
  </form>
  <p class="muted">Default credentials: <strong>admin</strong> / <strong>admin</strong>. Change them after first login.</p>
</div>
